<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वाटर बिल कैलकुलेटर</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        label.input-label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="date"], input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            background-color: #fff3cd;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ffeeba;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .checkbox-group:hover {
            background-color: #ffe8a1;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        .checkbox-group span {
            color: #856404;
            margin-bottom: 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-print {
            background-color: #28a745;
        }
        .btn-print:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }
        th {
            background-color: #e9ecef;
            color: #333;
        }
        .summary-section {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
            font-weight: bold;
            font-size: 14px;
        }
        .summary-section td {
            padding: 10px 15px;
            border: 1px solid #000;
        }
        .bg-bill { background-color: #a8e6cf; }
        .bg-penalty { background-color: #ff8b94; color: white; }
        .bg-discount { background-color: #d4edda; color: #155724; } 
        .bg-advance { background-color: #4facfe; color: white; }
        .bg-total { background-color: #e0e0e0; }
        .text-right { text-align: right; }
        
        .penalty-waived-full {
            background-color: #d6d6d6 !important;
            color: #555 !important;
        }
        .penalty-waived-partial {
            background-color: #ffb3ba !important;
            color: #333 !important;
        }

        /* रिमार्क के लिए नया और अट्रैक्टिव डिज़ाइन */
        .remark-box {
            margin-top: 25px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-left: 6px solid #28a745;
            border-radius: 6px;
            font-size: 16px;
            color: #2c3e50;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            line-height: 1.6;
        }
        .highlight-amount {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
        }
        .highlight-discount {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }

        @media print {
            body { background-color: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>वाटर बिल (नगर पालिका परिषद)</h2>
    
    <div class="input-group no-print">
        <div class="input-box">
            <label class="input-label" for="startDate">बिल प्रारंभ तिथि (Start Date):</label>
            <input type="date" id="startDate" value="2011-01-01">
        </div>
        <div class="input-box">
            <label class="input-label" for="endDate">बिल समाप्ति तिथि (End Date):</label>
            <input type="date" id="endDate">
        </div>
        <div class="input-box">
            <label class="input-label" for="advancePayment">अग्रिम भुगतान (Advance Payment ₹):</label>
            <input type="number" id="advancePayment" value="300" min="0" step="150">
        </div>
    </div>

    <label class="checkbox-group no-print" for="lokAdalat">
        <input type="checkbox" id="lokAdalat" onchange="calculateBill()">
        <span>लोक अदालत स्लैब नियम लागू करें (चालू वर्ष की पेनल्टी छोड़कर)</span>
    </label>

    <div class="btn-group no-print">
        <button onclick="calculateBill()">बिल कैलकुलेट करें</button>
        <button class="btn-print" onclick="window.print()">🖨️ प्रिंट बिल</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Rate (₹)</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Months Calculated</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody id="slabsBody">
        </tbody>
    </table>

    <table class="summary-section">
        <tr>
            <td colspan="4" class="text-right bg-bill">Bill Amount (Arrears + Current Year)</td>
            <td width="20%" id="totalBillAmount" class="bg-bill text-center">0.00</td>
        </tr>
        <tr>
            <td colspan="4" id="penaltyLabel" class="text-right bg-penalty">Penalty 10%</td>
            <td id="penaltyAmount" class="bg-penalty text-center">0.00</td>
        </tr>
        <tr id="discountRow" style="display: none;">
            <td colspan="4" class="text-right bg-discount">Lok Adalat Discount (छूट)</td>
            <td id="discountAmount" class="bg-discount text-center">0.00</td>
        </tr>
        <tr>
            <td colspan="4" class="text-right bg-advance">Advance Payment</td>
            <td id="advPaymentDisplay" class="bg-advance text-center">0.00</td>
        </tr>
        <tr>
            <td colspan="4" class="text-right bg-total">Total Charge</td>
            <td id="finalCharge" class="bg-total text-center">0.00</td>
        </tr>
    </table>

    <div id="remarkBox" class="remark-box" style="display: none;"></div>
</div>

<script>
    const rateSlabs = [
        { rate: 9.25, start: new Date('1980-01-01'), end: new Date('1996-03-31') },
        { rate: 40,   start: new Date('1996-04-01'), end: new Date('2011-03-31') },
        { rate: 80,   start: new Date('2011-04-01'), end: new Date('2016-06-30') },
        { rate: 100,  start: new Date('2016-07-01'), end: new Date('2025-03-31') },
        { rate: 150,  start: new Date('2025-04-01'), end: new Date('2050-12-31') } 
    ];

    function formatDate(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}/${m}/${y}`;
    }

    function getOverlapMonths(slabStart, slabEnd, userStart, userEnd) {
        const overlapStart = new Date(Math.max(slabStart, userStart));
        const overlapEnd = new Date(Math.min(slabEnd, userEnd));

        if (overlapStart > overlapEnd) return 0; 

        let months = (overlapEnd.getFullYear() - overlapStart.getFullYear()) * 12;
        months -= overlapStart.getMonth();
        months += overlapEnd.getMonth();
        
        return months + 1; 
    }

    function calculateAmountForDateRange(reqStart, reqEnd) {
        if (reqStart > reqEnd) return 0;
        let amt = 0;
        rateSlabs.forEach(slab => {
            const m = getOverlapMonths(slab.start, slab.end, reqStart, reqEnd);
            if (m > 0) amt += m * slab.rate;
        });
        return amt;
    }

    function calculateBill() {
        const userStartInput = document.getElementById('startDate').value;
        const userEndInput = document.getElementById('endDate').value;
        const advancePayment = parseFloat(document.getElementById('advancePayment').value) || 0;
        const isLokAdalat = document.getElementById('lokAdalat').checked;

        if (!userStartInput || !userEndInput) return;

        if (advancePayment > 0 && advancePayment % 150 !== 0) {
            alert("कृपया ध्यान दें: अग्रिम भुगतान (Advance Payment) केवल 150 के गुणांक (जैसे 150, 300, 450, 600...) में ही दर्ज करें।");
            return; 
        }

        const userStart = new Date(userStartInput);
        const userEnd = new Date(userEndInput);
        
        if (userStart > userEnd) {
            alert("प्रारंभ तिथि समाप्ति तिथि से पहले की होनी चाहिए!");
            return;
        }

        const tbody = document.getElementById('slabsBody');
        tbody.innerHTML = ''; 

        let totalBill = 0;
        let lastMonthRate = 0;

        rateSlabs.forEach(slab => {
            const months = getOverlapMonths(slab.start, slab.end, userStart, userEnd);
            let amount = 0;

            if (months > 0) {
                amount = months * slab.rate;
                totalBill += amount;
            }
            
            if (userEnd >= slab.start && userEnd <= slab.end) {
                lastMonthRate = slab.rate;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${slab.rate}</td>
                <td>${formatDate(slab.start)}</td>
                <td>${formatDate(slab.end)}</td>
                <td>${months > 0 ? months : 0}</td>
                <td>${amount}</td>
            `;
            tbody.appendChild(tr);
        });

        const today = new Date();
        today.setHours(0, 0, 0, 0); 

        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth(); 
        
        const currentFyStartYear = currentMonth >= 3 ? currentYear : currentYear - 1;
        const currentFyStart = new Date(currentFyStartYear, 3, 1); 
        const endOfArrears = new Date(currentFyStartYear, 2, 31); 

        let arrearsBill = calculateAmountForDateRange(userStart, new Date(Math.min(userEnd, endOfArrears)));
        let currentFyBill = calculateAmountForDateRange(new Date(Math.max(userStart, currentFyStart)), userEnd);

        let penaltyableArrears = arrearsBill;
        let penaltyableCurrentFy = currentFyBill;
        
        const graceDueDate = new Date(userEnd.getFullYear(), userEnd.getMonth() + 1, 15);
        graceDueDate.setHours(0, 0, 0, 0);
        
        const isGracePeriod = today <= graceDueDate;

        if (isGracePeriod) {
            if (currentFyBill >= lastMonthRate && totalBill > 0) {
                penaltyableCurrentFy -= lastMonthRate;
            } else if (arrearsBill >= lastMonthRate && totalBill > 0) {
                penaltyableArrears -= lastMonthRate;
            }
        }

        let standardArrearsPenalty = penaltyableArrears * 0.10;
        let currentFyPenalty = penaltyableCurrentFy * 0.10; 
        let finalArrearsPenalty = standardArrearsPenalty;
        
        let discountAmt = 0; 

        const penaltyLabel = document.getElementById('penaltyLabel');
        const penaltyAmountCell = document.getElementById('penaltyAmount');
        const discountRow = document.getElementById('discountRow'); 
        const discountAmountCell = document.getElementById('discountAmount');
        
        let baseLabelText = "Penalty 10%";
        if (isGracePeriod) {
            baseLabelText += ` (Grace till ${formatDate(graceDueDate)})`; 
        } else {
            baseLabelText += " (After Due Date)";
        }

        if (isLokAdalat) {
            if (totalBill <= 10000) {
                finalArrearsPenalty = 0; 
                discountAmt = standardArrearsPenalty; 
                penaltyLabel.innerText = baseLabelText + " - Arrears 100% Waived";
                penaltyLabel.className = "text-right penalty-waived-full";
                penaltyAmountCell.className = "text-center penalty-waived-full";
            } 
            else if (totalBill > 10000 && totalBill <= 50000) {
                finalArrearsPenalty = standardArrearsPenalty * 0.25; 
                discountAmt = standardArrearsPenalty * 0.75; 
                penaltyLabel.innerText = baseLabelText + " - Arrears 75% Waived";
                penaltyLabel.className = "text-right penalty-waived-partial";
                penaltyAmountCell.className = "text-center penalty-waived-partial";
            } 
            else if (totalBill > 50000) {
                finalArrearsPenalty = standardArrearsPenalty * 0.50; 
                discountAmt = standardArrearsPenalty * 0.50; 
                penaltyLabel.innerText = baseLabelText + " - Arrears 50% Waived";
                penaltyLabel.className = "text-right penalty-waived-partial";
                penaltyAmountCell.className = "text-center penalty-waived-partial";
            }
        } else {
            finalArrearsPenalty = standardArrearsPenalty;
            discountAmt = 0; 
            penaltyLabel.innerText = baseLabelText;
            penaltyLabel.className = "text-right bg-penalty";
            penaltyAmountCell.className = "text-center bg-penalty";
        }

        if (discountAmt > 0) {
            discountRow.style.display = ''; 
            discountAmountCell.innerText = "- " + discountAmt.toFixed(2);
        } else {
            discountRow.style.display = 'none'; 
        }

        const finalPenalty = finalArrearsPenalty + currentFyPenalty;
        const totalCharge = totalBill + finalPenalty + advancePayment; 

        document.getElementById('totalBillAmount').innerText = totalBill.toFixed(2);
        document.getElementById('penaltyAmount').innerText = finalPenalty.toFixed(2);
        document.getElementById('advPaymentDisplay').innerText = advancePayment.toFixed(2);
        document.getElementById('finalCharge').innerText = totalCharge.toFixed(2);

        // अपडेटेड और अट्रैक्टिव रिमार्क लॉजिक
        const remarkBox = document.getElementById('remarkBox');
        if (totalCharge > 0 || totalBill > 0) {
            remarkBox.style.display = 'block';
            
            // बेसिक रिमार्क
            let remarkHtml = `<strong>📌 रिमार्क:</strong> दिनांक <strong>${formatDate(userStart)}</strong> से <strong>${formatDate(userEnd)}</strong> तक की कुल देय राशि <span class="highlight-amount">₹${totalCharge.toFixed(2)}</span> है।`;
            
            // अगर डिस्काउंट मिला है, तो एक नई लाइन में डिस्काउंट हाईलाइट करें
            if (discountAmt > 0) {
                remarkHtml += `<br><span style="color: #155724;">🎉 <em>(लोक अदालत के अंतर्गत <span class="highlight-discount">₹${discountAmt.toFixed(2)}</span> की पेनल्टी छूट दी गई है।)</em></span>`;
            }
            
            remarkBox.innerHTML = remarkHtml;
        } else {
            remarkBox.style.display = 'none';
        }
    }

    window.onload = function() {
        const today = new Date();
        const lastDayOfPrevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        
        const yyyy = lastDayOfPrevMonth.getFullYear();
        const mm = String(lastDayOfPrevMonth.getMonth() + 1).padStart(2, '0');
        const dd = String(lastDayOfPrevMonth.getDate()).padStart(2, '0');
        
        document.getElementById('endDate').value = `${yyyy}-${mm}-${dd}`;
        calculateBill();
    };
</script>

</body>
</html>
